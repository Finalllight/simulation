# Default simulation configuration for grid transport system

grid:
  x_cells: 10
  y_cells: 10
  cell_size: 1.0       # meters
  rail_width: 0.05
  world_origin: [0.0, 0.0]

simulation:
  timestep: 0.005       # seconds (200 Hz)
  gravity: [0, 0, -9.81]

vehicles:
  - device_id: "vehicle_0"
    chassis_mass: 120.0
    chassis_dims: [0.9, 0.7, 0.35]   # lx, ly, lz (meters)
    wheel_radius: 0.06
    wheel_width: 0.04
    max_speed: 1.2
    max_acceleration: 0.6
    max_lift: 0.4
    lift_speed: 0.08
    initial_grid_pos: [0, 0]
    initial_lift: 0.0
    xy_kp: 1000
    xy_kv: 600
    z_kp: 20000
    z_kv: 900

  - device_id: "vehicle_1"
    chassis_mass: 120.0
    chassis_dims: [0.9, 0.7, 0.35]
    wheel_radius: 0.06
    wheel_width: 0.04
    max_speed: 1.2
    max_acceleration: 0.6
    max_lift: 0.4
    lift_speed: 0.08
    initial_grid_pos: [2, 0]
    initial_lift: 0.0
    xy_kp: 1000
    xy_kv: 600
    z_kp: 20000
    z_kv: 900
